# Full dev stack, isolated from every other project on this machine.
#   docker compose up -d              # app (hot reload) + postgres
#   docker compose up -d postgres     # database only (then `npm run dev` on the host)
#   docker compose --profile e2e up -d postgres-e2e   # throwaway DB for Playwright
#
# Every published port is env-driven and defaults to a dungeoncrawler-specific
# block, so this stack never fights another project for 3000/5432/5433. Override
# any of them in `.env` (see `.env.example`); the compose project name keeps the
# network and volumes namespaced too.
name: dungeoncrawler

services:
  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Inside the compose network postgres is reached by service name on its
      # native port, regardless of which host port is published.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dungeoncrawler}
    env_file:
      - path: .env.local
        required: false
    ports:
      # Bound on all interfaces (unlike wargame's 127.0.0.1) so LAN devices
      # can reach the game; set APP_PORT to move it.
      - '${APP_PORT:-3210}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/.next
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dungeoncrawler}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5442}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Throwaway database for Playwright. Started only with `--profile e2e`, keeps
  # its data in tmpfs so every `up` is a clean schema and test runs never touch
  # the dev volume above.
  postgres-e2e:
    profiles: ['e2e']
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dungeoncrawler}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${E2E_POSTGRES_PORT:-5443}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
